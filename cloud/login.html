<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ · Expense Health</title>
<!-- EMBEDDED_FONTS -->
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6f8;color:#171d25;font-family:'Health Sans','Health Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}.panel{width:100%;max-width:430px;background:white;border:1px solid #e3e6eb;border-radius:22px;padding:38px;box-shadow:0 16px 50px #14223408}.logo{display:grid;place-items:center;width:44px;height:44px;background:#111720;color:white;border-radius:12px;font-size:24px}.eyebrow{margin:24px 0 8px;font-size:11px;font-weight:600;letter-spacing:.13em;color:#687684}h1{font-size:29px;line-height:1.4;margin:0 0 8px;font-weight:700;letter-spacing:-.04em}.intro{font-size:13px;color:#6b7582;line-height:1.8;margin:0 0 26px}label{display:block;font-size:13px;font-weight:500;margin:17px 0 8px}input[type=text],input[type=password]{display:block;width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid #d9dfe7;border-radius:9px;background:#fff;color:#171d25}input:focus{outline:3px solid #d3e1ff;border-color:#729bf0}.remember{display:flex;align-items:flex-start;gap:10px;font-weight:400;font-size:13px;margin:20px 0 24px;line-height:1.7}.remember input{accent-color:#171d25;margin:4px 0 0;width:16px;height:16px}.remember small{display:block;font-size:11px;color:#7e8792}button{width:100%;padding:13px;border:0;border-radius:10px;color:white;background:#111720;font:600 14px 'Health Sans','Health Thai',system-ui;cursor:pointer}button:hover{background:#2c3746}.error{background:#fff0ee;color:#9d342e;border-radius:9px;padding:12px;font-size:13px;line-height:1.8}.footer{margin:22px 0 0;text-align:center;font-size:11px;color:#8b94a1;line-height:1.8}@media(max-width:450px){.panel{padding:28px 24px}}
</style></head><body><main class="panel"><div class="logo" aria-hidden="true">ϟ</div><p class="eyebrow">EXPENSE / CLOUD HEALTH</p><h1>เข้าสู่ระบบ Healthcheck</h1><p class="intro">ดูสุขภาพ n8n และการทำงานล่าสุดของบอต</p><!-- LOGIN_MESSAGE -->
<form method="post" action="/login"><label for="username">ชื่อผู้ใช้</label><input id="username" name="username" type="text" value="health" autocomplete="username" required maxlength="100"><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><label class="remember"><input type="checkbox" name="remember" checked><span>จำฉันไว้ 30 วัน<small>เหมาะสำหรับอุปกรณ์ส่วนตัวของคุณ</small></span></label><button type="submit">เข้าสู่ระบบ →</button></form><p class="footer">ใช้ชื่อผู้ใช้และรหัสผ่านเดิม<br>หากไม่เลือกจำฉันไว้ เซสชันมีอายุสูงสุด 12 ชั่วโมง</p></main></body></html>
